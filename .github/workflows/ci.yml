name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test & clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --features nusb
      - name: Test (default features)
        run: cargo test --all-targets
      - name: Test (nusb feature)
        run: cargo test --all-targets --features nusb
      - name: Doc tests
        run: cargo test --doc --features nusb
      - name: Clippy
        run: cargo clippy --all-targets --features nusb -- -D warnings
      # Runs as root to open /dev/uhid and the virtual /dev/hidraw node;
      # HIDRA_HIDRAW_REQUIRED makes it fail rather than self-skip if uhid is absent.
      - name: uhid integration test (native backend)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The Azure runner kernel ships uhid in linux-modules-extra, not the base image.
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe uhid
          cd e2e
          bin=$(cargo test -p linux-hidraw --test uhid --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="uhid") | .executable' \
            | grep . | tail -1)
          echo "running: $bin"
          sudo HIDRA_HIDRAW_REQUIRED=1 "$bin" --nocapture --test-threads=1
      # The Azure runner kernel has no USB-gadget support (dummy_hcd absent even
      # from linux-modules-extra), so this self-skips there; runs for real on any
      # kernel with dummy_hcd.
      - name: nusb gadget integration test (Backend::Nusb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! sudo modprobe dummy_hcd 2>/dev/null; then
            echo "::warning title=nusb E2E skipped::dummy_hcd unavailable on $(uname -r) (cloud kernel has no USB-gadget support); nusb integration test runs on kernels that ship dummy_hcd"
            exit 0
          fi
          # linux-nusb compiles the nusb backend in via its dev-dependency and
          # selects it at run time through Caps::backend, so no --features flag here.
          cd e2e
          bin=$(cargo test -p linux-nusb --test nusb --no-run --message-format=json \
            | jq -r 'select(.reason=="compiler-artifact" and .target.name=="nusb") | .executable' \
            | grep . | tail -1)
          echo "running: $bin"
          sudo HIDRA_NUSB_REQUIRED=1 "$bin" --nocapture --test-threads=1

  wasm:
    name: wasm32 / WebHID
    runs-on: ubuntu-latest
    # Repeated from .cargo/config.toml because setting RUSTFLAGS here would otherwise override it.
    env:
      RUSTFLAGS: --cfg=web_sys_unstable_apis -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --target wasm32-unknown-unknown
      - name: Clippy
        run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      # The docs job only builds the native target, so a doc link to a
      # native-only item breaks wasm docs without CI noticing.
      - name: Docs
        run: cargo doc --no-deps --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: --cfg=web_sys_unstable_apis -D warnings

  msrv:
    name: msrv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with `rust-version` in Cargo.toml.
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features nusb
