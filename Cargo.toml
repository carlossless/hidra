[package]
name = "hidra"
version = "0.0.2"
edition = "2021"
# Applies to the default feature set (the per-OS backends and WebHID). Turning
# on `nusb` raises the effective floor to whatever nusb itself requires (1.85
# as of nusb 0.2.7); cargo reports that on its own.
rust-version = "1.77"
description = "Pure Rust HID library."
license = "MIT"
repository = "https://github.com/carlossless/hidra"
keywords = ["hid", "hidapi", "usb", "webhid", "hidraw"]
categories = ["hardware-support", "api-bindings", "wasm"]

# Document every backend on docs.rs: the host (native + the `nusb` feature) and
# the wasm/WebHID target. WebHID needs the still-unstable web-sys cfg.
[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
rustc-args = ["--cfg=web_sys_unstable_apis"]
rustdoc-args = ["--cfg=web_sys_unstable_apis"]

# `#![deny(missing_docs)]` and friends live here so every target and every
# backend is held to the same bar without repeating attributes per module.
# `clippy::undocumented_unsafe_blocks` is deliberately not enabled: the FFI
# backends carry SAFETY comments where an invariant is actually at stake, and
# requiring one on every `unsafe { GetLastError() }` would bury those.
[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
doc_markdown = "warn"

[features]
default = []
# USB-transport backend built on nusb (pure Rust).
nusb = ["dep:nusb"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = { version = "0.2.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell_PropertiesSystem",
]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.123"
js-sys = "0.3.100"
wasm-bindgen-futures = "0.4.73"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3.100"
features = [
    "Window",
    "Navigator",
    "DomException",
    "Event",
    "EventTarget",
    "Hid",
    "HidDevice",
    "HidDeviceFilter",
    "HidDeviceRequestOptions",
    "HidConnectionEvent",
    "HidInputReportEvent",
    "HidCollectionInfo",
    "HidReportInfo",
    "HidReportItem",
    "HidUnitSystem",
]
