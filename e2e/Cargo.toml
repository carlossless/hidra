# Test crates. Run per crate, never the whole workspace at once: hidra's `nusb`
# feature switches the Linux backend, so linux-hidraw and linux-nusb must build
# separately.
[workspace]
resolver = "2"
members = [
    "shared/conformance",
    "targets/linux-hidraw",
    "targets/linux-nusb",
    "targets/macos",
    "targets/windows",
    "targets/cynthion",
]
