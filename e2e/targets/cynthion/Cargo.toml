# Runs the conformance suite against a real USB HID device emulated by a Cynthion
# running Facedancer (device.py), driven over a TCP control channel.
[package]
name = "cynthion"
version = "0.0.0"
edition = "2021"
publish = false

# Both backends are compiled in; HIDRA_BACKEND selects one per run, so a single
# binary covers the hidraw/nusb matrix against the same physical device.
[dev-dependencies]
hidra = { path = "../../..", features = ["nusb"] }
conformance = { path = "../../shared/conformance" }
