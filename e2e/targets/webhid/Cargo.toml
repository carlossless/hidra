# wasm harness driving hidra's WebHID backend, exercised by the Playwright test here.
[package]
name = "hidra-web-test"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
hidra = { path = "../../.." }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Own workspace so the native fixture/ crate is not folded into this wasm one.
[workspace]
exclude = ["fixture"]
